	<body>
		<div class="container">
					<form id="bookingForm" class="form">
						<h1>Booking Form</h1>
							
						<label for="name">Full Names:</label><br>
						<input type="text" placeholder="Names">

						<br>
						<br>
						<br>

						<label for="e-mail">E-mail:</label><br>
						<input type="email" placeholder="example@gmail.com" required>

						<br>
						<br>
						<br>

						<label for="phoneNumber">Phone Number:</label><br>
						<input type="phonenumber" placeholder="+266.....">

						<br>
						<br>
						<br>

						<label for="date">Check-in Date:</label><br>
						<input type="date">

						<br>
						<br>
						<br>

						<label for="guest">Guests:</label><br>
						<input type="number" id="guests" min="2" placeholder="1,2,3,4....." oninput="calculateFullPrice()">

						<br>
						<br>
						<br>

						<label for="nights">Night</label><br>
						<input type="number" id="nights" min="2" placeholder="1,2,3,4....." oninput="calculateFullPrice()">

						<br>
						<br>
						<br>

						<label for="roomchoice">Room Choice:</label><br>
						<select id="roomchoice" required onchange="calculateFullPrice()">
							<option value="500">Economy (M500 per night)</option>
							<option value="900">Standard (M900 per night/person)</option>
							<option value="1200">Premium (M1200 per night/person)</option>
						</select>

						<h3>Total: M<span id="total">0</span></h3>
					</form>

					<form class="form2">
						<label for="name">Full Name:</label><br>
						<input type="text" placeholder="Type here..."required>
						<br>
						<br>
						<label for="e-mail">E-mail:</label><br>
						<input type="email" placeholder="example23@gmail.com" required>
						<br>
						<br>
						<label for="quiries">Quiries:</label><br>
						<textarea placeholder="Type here...."></textarea>
						<input type="submit" value="submit">
					</form>	
		</div>
		<div>
			<button onclick="myFunction()">Dark-Mode</button>
		</div>

		<script>
			function myFunction() {
				var element = document.body;
				element.classList.toggle("dark-mode");

			}

				function calculateFullPrice() {
					var guestCount = Number(document.getElementById('guests').value)
					var nightCount = Number(document.getElementById('nights').value)
					var price = Number(document.getElementById('roomchoice').value)

					var total = guestCount * nightCount * price;

					document.getElementById("total").textContent = total;
				}
		</script>

	</body>
